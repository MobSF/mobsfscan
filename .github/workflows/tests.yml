name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SEMGREP_R2C_INTERNAL_EXPLICIT_SEMGREPIGNORE: ./tests/assets/src/.semgrepignore

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "packaging>=22.0"
        pip install tox
    
    - name: Run linting
      run: tox -e lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    
    - name: Run Bandit
      run: tox -e bandit

  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install Semgrep
      run: pip install semgrep==0.117.0
    
    - name: Validate Semgrep rules
      run: semgrep --validate --strict --config=./mobsfscan/rules/semgrep/
    
    - name: Test Semgrep rules
      run: |
        SEMGREP_SETTINGS_FILE=/dev/null semgrep --metrics=off --test \
          --config ./mobsfscan/rules/semgrep/ \
          ./tests/assets/rules/semgrep/

  test:
    name: Test - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "packaging>=22.0"
        pip install tox
    
    - name: Run tests
      run: tox -e py
    
    - name: Clean up
      if: always()
      run: tox -e clean

  build-status:
    name: Build Status
    if: always()
    needs: [lint, security, semgrep, test]
    runs-on: ubuntu-latest
    steps:
    - name: Check build status
      run: |
        if [[ "${{ needs.lint.result }}" != "success" ]] || \
           [[ "${{ needs.security.result }}" != "success" ]] || \
           [[ "${{ needs.semgrep.result }}" != "success" ]] || \
           [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi
