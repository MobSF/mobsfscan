name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SEMGREP_R2C_INTERNAL_EXPLICIT_SEMGREPIGNORE: ./tests/assets/src/.semgrepignore

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox semgrep==1.172.0

    - name: Lint
      run: |
        tox -e lint

    - name: Bandit
      run: |
        tox -e bandit

    - name: Semgrep validate rules
      run: |
        semgrep --metrics=off --validate --strict --config=./mobsfscan/rules/semgrep/

    - name: Semgrep tests
      run: |
        SEMGREP_SETTINGS_FILE=/dev/null semgrep --metrics=off --test --config ./mobsfscan/rules/semgrep/ ./tests/assets/rules/semgrep/

    - name: Run tests
      run: |
        tox -e py

    - name: Clean Up
      run: |
        tox -e clean
