rules:
  - id: android_kotlin_hiddenui
    patterns:
      - pattern-either:
          - pattern: |
              $V.visibility = View.GONE
          - pattern: |
              $V.visibility = View.INVISIBLE
          - pattern: |
              $V.visibility = if ($C) View.GONE else $E
          - pattern: |
              $V.visibility = if ($C) View.INVISIBLE else $E
          - pattern: |
              $V.setVisibility(View.GONE)
          - pattern: |
              $V.setVisibility(View.INVISIBLE)
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(?:password|passcode|pin|cvv|card(?:num|number)?|secret|token|otp|auth).*
    message: >-
      Hidden elements in view can be used to hide data from user. But this data
      can be leaked.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-919
      owasp-mobile: m1
      masvs: storage-7
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#checking-for-sensitive-data-disclosure-through-the-user-interface-mstg-storage-7
  - id: android_kotlin_logging
    patterns:
      - pattern-either:
          - pattern: |
              Log.$M(...)
          - pattern: |
              System.out.print(...)
          - pattern: |
              System.out.println(...)
          - pattern: |
              System.err.print(...)
          - pattern: |
              System.err.println(...)
    message: The App logs information. Sensitive information should never be logged.
    languages:
      - kotlin
    severity: INFO
    metadata:
      cwe: cwe-532
      owasp-mobile: m1
      masvs: storage-3
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#logs
  - id: android_kotlin_hardcoded
    patterns:
      - pattern-either:
          - pattern: |
              $X = "..."
          - pattern: |
              val $X = "..."
          - pattern: |
              var $X = "..."
          - pattern: |
              const val $X = "..."
      - pattern-not: |
          $X = ""
      - pattern-not: |
          val $X = ""
      - pattern-not: |
          var $X = ""
      - metavariable-regex:
          metavariable: $X
          regex: '(?i)^(?:password|pass|username|secret|key|(?:api|secret|private|access|encryption|auth)_?key)$'
    message: >-
      Files may contain hardcoded sensitive information like usernames,
      passwords, keys etc.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-798
      owasp-mobile: m9
      masvs: storage-14
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#storing-a-key---example
  - id: android_kotlin_world_writable
    patterns:
      - pattern-either:
          - pattern: |
              Context.MODE_WORLD_WRITEABLE
          - pattern: |
              $C.getSharedPreferences($N, 2)
          - pattern: |
              $C.openFileOutput($N, 2)
    message: The file is World Writable. Any App can write to the file
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-276
      owasp-mobile: m2
      masvs: storage-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#testing-local-storage-for-sensitive-data-mstg-storage-1-and-mstg-storage-2
  - id: android_kotlin_world_readable
    patterns:
      - pattern-either:
          - pattern: |
              Context.MODE_WORLD_READABLE
          - pattern: |
              $C.getSharedPreferences($N, 1)
          - pattern: |
              $C.openFileOutput($N, 1)
    message: The file is World Readable. Any App can read from the file
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-276
      owasp-mobile: m2
      masvs: storage-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#testing-local-storage-for-sensitive-data-mstg-storage-1-and-mstg-storage-2
  - id: android_kotlin_world_read_write
    patterns:
      - pattern: |
          $C.openFileOutput($N, 3)
    message: The file is World Readable and Writable. Any App can read/write to the file
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-276
      owasp-mobile: m2
      masvs: storage-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#testing-local-storage-for-sensitive-data-mstg-storage-1-and-mstg-storage-2
  - id: android_kotlin_sensitive_input_keyboard_cache
    patterns:
      - pattern-either:
          - pattern: |
              $F.setInputType($T)
          - pattern: |
              $F.inputType = $T
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(?:password|passcode|pin|secret|otp|token).*
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!.*(?:TYPE_TEXT_VARIATION_PASSWORD|TYPE_TEXT_VARIATION_VISIBLE_PASSWORD|TYPE_NUMBER_VARIATION_PASSWORD|TYPE_TEXT_FLAG_NO_SUGGESTIONS)).*$'
    message: >-
      A sensitive input field is configured without a password variation or
      TYPE_TEXT_FLAG_NO_SUGGESTIONS. Disable suggestions for sensitive input.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-524
      owasp-mobile: m1
      masvs: storage-5
      reference: >-
        https://mas.owasp.org/MASTG/tests/android/MASVS-STORAGE/MASTG-TEST-0005/
  - id: android_kotlin_sensitive_notification
    patterns:
      - pattern-either:
          - pattern: |
              $B.setContentText($D)
          - pattern: |
              $B.setContentTitle($D)
          - pattern: |
              $B.setSubText($D)
          - pattern: |
              $B.setTicker($D)
      - metavariable-regex:
          metavariable: $D
          regex: (?i).*(?:password|passcode|pin|secret|otp|token|auth(?:entication)?code).*
    message: >-
      Secret-like data is displayed in a notification and may be exposed on the
      lock screen or to notification listeners.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-200
      owasp-mobile: m1
      masvs: storage-7
      reference: >-
        https://mas.owasp.org/MASTG/tests/android/MASVS-STORAGE/MASTG-TEST-0010/
  - id: android_kotlin_pending_intent_not_immutable
    patterns:
      - pattern: PendingIntent.$M($CTX, $REQ, $I, $FLAGS, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(?:getActivity|getActivities|getBroadcast|getService|getForegroundService)$
      - metavariable-regex:
          metavariable: $FLAGS
          regex: (?s)^(?!.*FLAG_IMMUTABLE).*$
      - pattern-not-inside: |
          $FLAGS = <... $P.FLAG_IMMUTABLE ...>
          ...
          PendingIntent.$M($CTX, $REQ, $I, $FLAGS, ...)
      - pattern-not-inside: |
          $FLAGS = <... FLAG_IMMUTABLE ...>
          ...
          PendingIntent.$M($CTX, $REQ, $I, $FLAGS, ...)
      - pattern-not-inside: |
          if (<... Build.VERSION.SDK_INT ...>) {
            ...
            $FLAGS = <... $P.FLAG_IMMUTABLE ...>
            ...
          }
          ...
          PendingIntent.$M($CTX, $REQ, $I, $FLAGS, ...)
      - pattern-not-inside: |
          if (<... Build.VERSION.SDK_INT ...>) $FLAGS = <... $P.FLAG_IMMUTABLE ...>
          ...
          PendingIntent.$M($CTX, $REQ, $I, $FLAGS, ...)
    message: >-
      PendingIntent is created without FLAG_IMMUTABLE. Prior to API 31,
      PendingIntents are mutable by default; a malicious app may amend the
      wrapped Intent (action, data, flags), especially when the base Intent
      is implicit. Always specify FLAG_IMMUTABLE unless mutability is
      required.
    languages:
      - kotlin
    severity: INFO
    metadata:
      cwe: cwe-926
      owasp-mobile: m1
      masvs: platform-4
      reference: >-
        https://developer.android.com/reference/android/app/PendingIntent#FLAG_IMMUTABLE
  - id: android_kotlin_db_on_external_storage
    pattern-either:
      - pattern-inside: |
          $P = $CTX.getExternalFilesDir(...)!!.path + $REST
          ...
          SQLiteDatabase.openOrCreateDatabase($P, ...)
      - pattern-inside: |
          $P = $CTX.getExternalFilesDir(...).path + $REST
          ...
          SQLiteDatabase.openOrCreateDatabase($P, ...)
      - pattern-inside: |
          $P = $CTX.getExternalFilesDir(...)!!.absolutePath + $REST
          ...
          SQLiteDatabase.openOrCreateDatabase($P, ...)
      - pattern-inside: |
          $P = Environment.getExternalStorageDirectory().path + $REST
          ...
          SQLiteDatabase.openOrCreateDatabase($P, ...)
      - pattern-inside: |
          $P = Environment.getExternalStorageDirectory().absolutePath + $REST
          ...
          SQLiteDatabase.openOrCreateDatabase($P, ...)
      - pattern-inside: |
          $P = Environment.getExternalStorageDirectory().toString() + $REST
          ...
          SQLiteDatabase.openOrCreateDatabase($P, ...)
      - pattern: |
          SQLiteDatabase.openOrCreateDatabase(<... Environment.getExternalStorageDirectory() ...>, ...)
      - pattern: |
          SQLiteDatabase.openOrCreateDatabase(<... Environment.getExternalStoragePublicDirectory(...) ...>, ...)
      - pattern: |
          SQLiteDatabase.openOrCreateDatabase(<... $CTX.getExternalFilesDir(...) ...>, ...)
      - pattern-inside: |
          $FILE = File(Environment.getExternalStorageDirectory(), $N)
          ...
          SQLiteDatabase.openOrCreateDatabase($FILE, ...)
      - pattern-inside: |
          $FILE = File($CTX.getExternalFilesDir(...), $N)
          ...
          SQLiteDatabase.openOrCreateDatabase($FILE.absolutePath, ...)
      - pattern-inside: |
          $FILE = File($CTX.getExternalFilesDir(...), $N)
          ...
          SQLiteDatabase.openOrCreateDatabase($FILE, ...)
      - pattern-inside: |
          $P = $CTX.getExternalFilesDir(...)!!.path + $REST
          ...
          SQLiteDatabase.openDatabase($P, ...)
      - pattern-inside: |
          $P = Environment.getExternalStorageDirectory().absolutePath + $REST
          ...
          SQLiteDatabase.openDatabase($P, ...)
      - pattern-inside: |
          $P = Environment.getExternalStoragePublicDirectory($D).path + $REST
          ...
          SQLiteDatabase.openDatabase($P, ...)
      - pattern: |
          SQLiteDatabase.openDatabase(<... Environment.getExternalStorageDirectory() ...>, ...)
      - pattern: |
          SQLiteDatabase.openDatabase(<... Environment.getExternalStoragePublicDirectory(...) ...>, ...)
      - pattern: |
          SQLiteDatabase.openDatabase(<... $CTX.getExternalFilesDir(...) ...>, ...)
      - pattern-inside: |
          $FILE = File($CTX.getExternalFilesDir(...), $N)
          ...
          SQLiteDatabase.openDatabase($FILE.absolutePath, ...)
      - pattern: |
          Room.databaseBuilder($C, $K, <... Environment.getExternalStorageDirectory() ...>)
      - pattern: |
          Room.databaseBuilder($C, $K, <... Environment.getExternalStoragePublicDirectory(...) ...>)
      - pattern: |
          Room.databaseBuilder($C, $K, <... $CTX.getExternalFilesDir(...) ...>)
      - pattern: |
          class $C(...) : SQLiteOpenHelper($CTX, <... Environment.getExternalStorageDirectory() ...>, ...)
      - pattern: |
          class $C(...) : SQLiteOpenHelper($CTX, <... $X.getExternalFilesDir($Y) ...>, ...)
      - pattern: |
          class $C(...) : SQLiteOpenHelper($CTX, <... Environment.getExternalStoragePublicDirectory($D) ...>, ...)
    message: >-
      SQLite database path comes from external storage.
      Environment.getExternalStorageDirectory() and
      getExternalStoragePublicDirectory() are shared storage and are
      world-readable through API 28. Context.getExternalFilesDir() is
      app-specific and is not world-readable from API 19, but the file is
      still outside internal storage. Prefer Context.getDatabasePath() or
      openOrCreateDatabase(name) so the database stays in internal storage.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-276
      owasp-mobile: m2
      masvs: storage-1
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md
  - id: android_kotlin_oauth_custom_scheme_redirect
    patterns:
      - pattern-either:
          - pattern: $B.setRedirectUri(Uri.parse($SCHEME))
          - pattern-inside: |
              $V = $SCHEME
              ...
              $B.setRedirectUri(Uri.parse($V))
      - metavariable-regex:
          metavariable: "$SCHEME"
          regex: ^"(?!https?:)[A-Za-z0-9._+-]+:/
    message: >-
      OAuth redirect URI uses a custom URL scheme. Any malicious app can
      register the same scheme and intercept the authorization response
      (code / PKCE verifier). Prefer App Links (https) verified redirects.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-601
      owasp-mobile: m2
      masvs: platform-2
      reference: >-
        https://datatracker.ietf.org/doc/html/rfc8252#section-7.1
