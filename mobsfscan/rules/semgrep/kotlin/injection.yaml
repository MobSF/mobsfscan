rules:
  - id: android_kotlin_sql_raw_query
    patterns:
      - pattern-either:
          - pattern: |
              $D.rawQuery(...)
          - pattern: |
              $D.execSQL(...)
    message: >-
      App uses SQLite Database and execute raw SQL query. Untrusted user input in
      raw SQL queries can cause SQL Injection. Also sensitive information should
      be encrypted and written to the database.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-78
      owasp-mobile: m7
      masvs: platform-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
  - id: android_kotlin_jackson_deserialize
    patterns:
      - pattern: |
          $M.enableDefaultTyping(...)
    message: >-
      The app uses jackson deserialization library. Deserialization of untrusted
      input can result in arbitrary code execution.
    languages:
      - kotlin
    severity: ERROR
    metadata:
      cwe: cwe-502
      owasp-mobile: m7
      masvs: platform-8
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-object-persistence-mstg-platform-8
  - id: android_kotlin_command_injection
    patterns:
      - pattern-not: |
          Runtime.getRuntime().exec("...")
      - pattern-not: |
          Runtime.getRuntime().exec(arrayOf("...", ...))
      - pattern: |
          Runtime.getRuntime().exec(...)
    message: User controlled strings in exec() will result in command execution.
    languages:
      - kotlin
    severity: ERROR
    metadata:
      cwe: cwe-78
      owasp-mobile: m7
      masvs: platform-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
  - id: android_kotlin_command_injection_warning
    patterns:
      - pattern-either:
          - pattern: |
              $RUNTIME.exec($X + $Y)
          - pattern: |
              $RUNTIME.exec(String.format(...))
          - pattern: |
              $RUNTIME.loadLibrary($X + $Y)
          - pattern: |
              $RUNTIME.loadLibrary(String.format(...))
          - pattern: |
              $RUNTIME.exec("=~/(sh|bash|ksh|csh|tcsh|zsh)/", "-c", $ARG, ...)
          - pattern: |
              $RUNTIME.exec(arrayOf("=~/(sh|bash|ksh|csh|tcsh|zsh)/", "-c", $ARG, ...))
      - pattern-inside: |
          val $RUNTIME = Runtime.getRuntime()
          ...
    message: >-
      A formatted or concatenated string was detected as input to a
      java.lang.Runtime call. This is dangerous if a variable is controlled by
      user input and could result in a command injection. Ensure your variables
      are not controlled by users or sufficiently sanitized.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-78
      owasp-mobile: m7
      masvs: platform-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
  - id: android_kotlin_object_deserialization
    patterns:
      - pattern: |
          ObjectInputStream(...)
    message: >-
      Found object deserialization using ObjectInputStream. Deserializing entire
      Java objects is dangerous because malicious actors can create Java object
      streams with unintended consequences. Ensure that the objects being
      deserialized are not user-controlled.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-502
      owasp-mobile: m1
      masvs: platform-8
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-object-persistence-mstg-platform-8
  - id: android_kotlin_xmlinputfactory_xxe
    patterns:
      - pattern-not-inside: |
          fun $METHOD(...) {
            ...
            $XMLFACTORY.setProperty("javax.xml.stream.isSupportingExternalEntities", false)
            ...
          }
      - pattern-either:
          - pattern: |
              val $XMLFACTORY = XMLInputFactory.newFactory(...)
          - pattern: |
              val $XMLFACTORY = XMLInputFactory.newInstance(...)
          - pattern: |
              XMLInputFactory.newFactory(...)
          - pattern: |
              XMLInputFactory.newInstance(...)
    message: >-
      XML external entities are not explicitly disabled for this
      XMLInputFactory. This could be vulnerable to XML external entity
      vulnerabilities. Explicitly disable external entities by setting
      "javax.xml.stream.isSupportingExternalEntities" to false.
    languages:
      - kotlin
    severity: ERROR
    metadata:
      cwe: cwe-611
      owasp-mobile: m8
      masvs: platform-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
  - id: android_kotlin_xmlinputfactory_xxe_enabled
    patterns:
      - pattern: |
          $XMLFACTORY.setProperty("javax.xml.stream.isSupportingExternalEntities", true)
    message: >-
      XML external entities are enabled for this XMLInputFactory. This is
      vulnerable to XML external entity attacks. Disable external entities by
      setting "javax.xml.stream.isSupportingExternalEntities" to false.
    languages:
      - kotlin
    severity: ERROR
    metadata:
      cwe: cwe-611
      owasp-mobile: m8
      masvs: platform-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
  - id: android_kotlin_xml_decoder_xxe
    patterns:
      - pattern: |
          fun $METHOD(...): $R {
            ...
            XMLDecoder(...)
            ...
          }
      - pattern-not: |
          fun $METHOD(...): $R {
            ...
            XMLDecoder("...")
            ...
          }
      - pattern-not: |
          fun $METHOD(...): $R {
            ...
            val $STR = "..."
            ...
            XMLDecoder($STR)
            ...
          }
    message: >-
      XMLDecoder should not be used to parse untrusted data.
      Deserializing user input can lead to arbitrary code execution.
      Use an alternative and explicitly disable external entities.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-611
      owasp-mobile: m8
      masvs: platform-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2

  - id: android_kotlin_provider_path_traversal
    patterns:
      - pattern-either:
          - pattern-inside: |
              fun openFile($URI: Uri, $MODE: String): $RET { ... }
          - pattern-inside: |
              override fun openFile($URI: Uri, $MODE: String): $RET { ... }
          - pattern-inside: |
              fun openAssetFile($URI: Uri, $MODE: String): $RET { ... }
          - pattern-inside: |
              override fun openAssetFile($URI: Uri, $MODE: String): $RET { ... }
          - pattern-inside: |
              fun openTypedAssetFile($URI: Uri, ...): $RET { ... }
          - pattern-inside: |
              override fun openTypedAssetFile($URI: Uri, ...): $RET { ... }
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $FILE = File($BASE, $URI.lastPathSegment)
                  - pattern: $FILE = File($URI.lastPathSegment)
                  - pattern: $FILE = File($BASE, $URI.getLastPathSegment())
                  - pattern: $FILE = File($URI.getLastPathSegment())
                  - pattern: $FILE = File($BASE, $URI.encodedPath)
                  - pattern: $FILE = File($URI.encodedPath)
                  - pattern: $FILE = File($BASE, $URI.getEncodedPath())
                  - pattern: $FILE = File($URI.getEncodedPath())
                  - pattern: $FILE = File($BASE, $URI.path)
                  - pattern: $FILE = File($URI.path)
                  - pattern: $FILE = File($BASE, $URI.getPath())
                  - pattern: $FILE = File($URI.getPath())
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $NAME = $URI.lastPathSegment
                              ...
                          - pattern-inside: |
                              $NAME = $URI.path
                              ...
                          - pattern-inside: |
                              $NAME = $URI.encodedPath
                              ...
                          - pattern-inside: |
                              $NAME = $URI.getLastPathSegment()
                              ...
                          - pattern-inside: |
                              $NAME = $URI.getPath()
                              ...
                          - pattern-inside: |
                              $NAME = $URI.getEncodedPath()
                              ...
                      - pattern-either:
                          - pattern: $FILE = File($BASE, $NAME)
                          - pattern: $FILE = File($NAME)
              - pattern-not-inside: |
                  $FILE = File(...)
                  ...
                  if (<... $FILE.canonicalPath.startsWith(...) ...>) {
                    ...
                  }
              - pattern-not-inside: |
                  $FILE = File(...)
                  ...
                  if (<... $FILE.getCanonicalPath().startsWith(...) ...>) {
                    ...
                  }
              - pattern-not-inside: |
                  $FILE = File(...)
                  ...
                  $CANON = $FILE.canonicalPath
                  ...
                  if (<... $CANON.startsWith(...) ...>) {
                    ...
                  }
              - pattern-not-inside: |
                  $FILE = File(...)
                  ...
                  $CANON = $FILE.getCanonicalPath()
                  ...
                  if (<... $CANON.startsWith(...) ...>) {
                    ...
                  }
          - patterns:
              - pattern-either:
                  - pattern: File($BASE, $URI.lastPathSegment)
                  - pattern: File($URI.lastPathSegment)
                  - pattern: File($BASE, $URI.getLastPathSegment())
                  - pattern: File($URI.getLastPathSegment())
                  - pattern: File($BASE, $URI.encodedPath)
                  - pattern: File($URI.encodedPath)
                  - pattern: File($BASE, $URI.getEncodedPath())
                  - pattern: File($URI.getEncodedPath())
                  - pattern: File($BASE, $URI.path)
                  - pattern: File($URI.path)
                  - pattern: File($BASE, $URI.getPath())
                  - pattern: File($URI.getPath())
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $NAME = $URI.lastPathSegment
                              ...
                          - pattern-inside: |
                              $NAME = $URI.path
                              ...
                          - pattern-inside: |
                              $NAME = $URI.encodedPath
                              ...
                          - pattern-inside: |
                              $NAME = $URI.getLastPathSegment()
                              ...
                          - pattern-inside: |
                              $NAME = $URI.getPath()
                              ...
                          - pattern-inside: |
                              $NAME = $URI.getEncodedPath()
                              ...
                      - pattern-either:
                          - pattern: File($BASE, $NAME)
                          - pattern: File($NAME)
              - pattern-not-inside: |
                  $FILE = File(...)
    message: >-
      ContentProvider openFile() or openAssetFile() builds a filesystem path
      from the URI without checking that file's canonical path. If the
      provider is exported, any app can traverse outside the intended
      directory using ../ segments.
    languages:
      - kotlin
    severity: ERROR
    metadata:
      cwe: cwe-22
      owasp-mobile: m1
      masvs: platform-4
      reference: >-
        https://mas.owasp.org/MASTG/tests/android/MASVS-PLATFORM/MASTG-TEST-0022/
  - id: android_kotlin_zip_slip
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $ENTRY = $ZIP.nextEntry
                  ...
              - pattern-either:
                  - patterns:
                      - pattern-either:
                          - pattern: $FILE = File($DIR, $ENTRY.name)
                          - pattern: $FILE = File($DIR, $ENTRY!!.name)
                      - pattern-not-inside: |
                          $FILE = File(...)
                          ...
                          if (<... $FILE.canonicalPath.startsWith(...) ...>) {
                            ...
                          }
                      - pattern-not-inside: |
                          $FILE = File(...)
                          ...
                          $CANON = $FILE.canonicalPath
                          ...
                          if (<... $CANON.startsWith(...) ...>) {
                            ...
                          }
                  - patterns:
                      - pattern-either:
                          - pattern: File($DIR, $ENTRY.name)
                          - pattern: File($DIR, $ENTRY!!.name)
                      - pattern-not-inside: |
                          $FILE = File(...)
          - patterns:
              - pattern-inside: |
                  $ENTRY = $ZIP.nextEntry
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $NAME = $ENTRY.name
                      ...
                  - pattern-inside: |
                      $NAME = $ENTRY!!.name
                      ...
              - pattern-either:
                  - patterns:
                      - pattern: $FILE = File($DIR, $NAME)
                      - pattern-not-inside: |
                          $FILE = File(...)
                          ...
                          if (<... $FILE.canonicalPath.startsWith(...) ...>) {
                            ...
                          }
                      - pattern-not-inside: |
                          $FILE = File(...)
                          ...
                          $CANON = $FILE.canonicalPath
                          ...
                          if (<... $CANON.startsWith(...) ...>) {
                            ...
                          }
                  - patterns:
                      - pattern: File($DIR, $NAME)
                      - pattern-not-inside: |
                          $FILE = File(...)
    message: >-
      ZipEntry file name flows into File() without a canonical-path check on
      that file. A malicious archive entry using ../ paths can write outside
      the extraction directory (ZipSlip).
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-22
      owasp-mobile: m1
      masvs: platform-2
      reference: >-
        https://snyk.io/research/zip-slip-vulnerability
  - id: android_kotlin_intent_redirection
    patterns:
      - pattern-either:
          - pattern-inside: |
              fun $M(...) {
                ...
                $I = $O.getParcelableExtra(...)
                ...
              }
          - pattern-inside: |
              fun $M(...) {
                ...
                $I = $O.getParcelableExtra<...>(...)
                ...
              }
      - pattern-either:
          - pattern: $C.startActivity($I)
          - pattern: $C.startService($I)
          - pattern: $C.startForegroundService($I)
          - pattern: $C.sendBroadcast($I)
    message: >-
      An Intent received via getParcelableExtra is re-dispatched. If the
      component is exported, a malicious app can supply an embedded Intent
      and escalate privileges (intent redirection).
    languages:
      - kotlin
    severity: ERROR
    metadata:
      cwe: cwe-926
      owasp-mobile: m1
      masvs: platform-4
      reference: >-
        https://mas.owasp.org/MASTG/Android/0x05h-Testing-Platform-Interaction/
