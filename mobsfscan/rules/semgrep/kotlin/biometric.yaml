rules:
  - id: android_kotlin_biometric_without_crypto
    patterns:
      - pattern-inside: |
          class $CALLBACK : BiometricPrompt.AuthenticationCallback() {
            ...
          }
      - pattern: |
          override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
            ...
          }
      - pattern-not: |
          override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
            ...
            result.cryptoObject
            ...
          }
      - pattern-not: |
          override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
            ...
            result.getCryptoObject()
            ...
          }
    message: >-
      Biometric authentication succeeds without using the cryptographic object
      from AuthenticationResult. Bind authentication to a Keystore-backed
      cryptographic operation so the protected operation cannot proceed solely
      from the callback result.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      cwe: cwe-287
      owasp-mobile: m4
      masvs: auth-8
      reference: >-
        https://mas.owasp.org/MASTG/tests/android/MASVS-AUTH/MASTG-TEST-0018/
