rules:
  - id: ios_hardcoded_secret
    patterns:
      - pattern-either:
          - pattern: |
              let $X = "..."
          - pattern: |
              var $X = "..."
          - pattern: |
              private let $X = "..."
          - pattern: |
              private var $X = "..."
          - pattern: |
              static let $X = "..."
          - pattern: |
              private static let $X = "..."
      - pattern-not: |
          let $X = ""
      - metavariable-regex:
          metavariable: $X
          regex: '(?i)^(?:password|pass|username|secret|key|(?:api|secret|private|access|encryption|auth)_?key)$'
    message: >-
      Files may contain hardcoded sensitive information like usernames,
      passwords, keys etc.
    languages:
      - swift
    severity: WARNING
    metadata:
      cwe: cwe-312
      masvs: storage-14
      owasp-mobile: m9
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#checking-memory-for-sensitive-data-mstg-storage-10
