rules:
  - id: ios_file_no_special
    patterns:
      - pattern-regex: '(?i)\.noFileProtection\b'
    message: The file has no special protections associated with it.
    languages:
      - swift
    severity: ERROR
    metadata:
      cwe: cwe-311
      masvs: storage-1
      owasp-mobile: m2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x06d-Testing-Data-Storage.md#ios-data-storage
  - id: ios_general_paste
    patterns:
      - pattern: |
          UIPasteboard.generalPasteboard
    message: >-
      Usage of generalPasteboard should be avoided. A malicious app can monitor the pasteboard in the background in iOS versions below 9.
    languages:
      - swift
    severity: INFO
    metadata:
      cwe: cwe-919
      masvs: platform-4
      owasp-mobile: m1
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x06h-Testing-Platform-Interaction.md#uipasteboard
  - id: ios_ssziparchive_unzip
    patterns:
      - pattern-either:
          - pattern: |
              SSZipArchive.unzipFile(atPath: $SRC, toDestination: $DEST)
          - pattern: |
              SSZipArchive.unzipFile(atPath: $SRC, toDestination: $DEST, overwrite: $O, password: $P)
    message: >-
      SSZipArchive extraction. Versions below 2.1.4 are vulnerable to path
      traversal (ZipSlip) when extracting malicious archives. Verify the
      library version and the trust level of the archive source.
    languages:
      - swift
    severity: WARNING
    metadata:
      cwe: cwe-22
      owasp-mobile: m1
      masvs: platform-2
      reference: >-
        https://snyk.io/research/zip-slip-vulnerability
