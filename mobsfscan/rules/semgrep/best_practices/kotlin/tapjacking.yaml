rules:
  - id: android_tapjacking
    patterns:
      - pattern: |
          $V.setFilterTouchesWhenObscured(true)
    message: This app does not have capabilities to prevent tapjacking attacks.
    languages:
      - kotlin
    severity: INFO
    metadata:
      cwe: cwe-200
      owasp-mobile: m1
      masvs: platform-9
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-for-overlay-attacks-mstg-platform-9
