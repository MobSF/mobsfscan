# Zip path traversal concept:
# https://snyk.io/research/zip-slip-vulnerability
rules:
  - id: android_zip_slip
    patterns:
      - pattern-either:
          - pattern-inside: |
              $RET $M(...) {
                ...
                $TYPE $ENTRY = $ZIP.getNextEntry();
                ...
              }
          - pattern-inside: |
              $RET $M(...) {
                ...
                $ENTRY = $ZIP.getNextEntry();
                ...
              }
          - pattern-inside: |
              $RET $M(...) {
                ...
                $TYPE $ENTRY = $ENTRIES.nextElement();
                ...
              }
      - pattern: new File($DIR, $ENTRY.getName())
    message: >-
      ZipEntry file name flows into new File() without canonicalization.
      A malicious archive entry using ../ paths can write outside the
      extraction directory (ZipSlip). Validate the canonical path before
      writing.
    languages:
      - java
    severity: WARNING
    metadata:
      cwe: cwe-22
      owasp-mobile: m1
      masvs: platform-2
      reference: >-
        https://snyk.io/research/zip-slip-vulnerability
