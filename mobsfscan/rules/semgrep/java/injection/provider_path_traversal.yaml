rules:
  - id: android_provider_path_traversal
    patterns:
      - pattern-either:
          - pattern-inside: |
              $RET openFile(Uri $URI, ...) { ... }
          - pattern-inside: |
              $RET openAssetFile(Uri $URI, ...) { ... }
          - pattern-inside: |
              $RET openTypedAssetFile(Uri $URI, ...) { ... }
      - pattern-either:
          - pattern: new File($BASE, $URI.getLastPathSegment())
          - pattern: new File($URI.getLastPathSegment())
          - pattern: new File($BASE, $URI.getEncodedPath())
          - pattern: new File($URI.getEncodedPath())
          - pattern: new File($BASE, $URI.getPath())
          - pattern: new File($URI.getPath())
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $NAME = $URI.getLastPathSegment();
                      ...
                  - pattern-inside: |
                      $NAME = $URI.getEncodedPath();
                      ...
                  - pattern-inside: |
                      $NAME = $URI.getPath();
                      ...
              - pattern-either:
                  - pattern: new File($BASE, $NAME)
                  - pattern: new File($NAME)
      - pattern-not-inside: |
          $FILE = new File(...);
          ...
          if (<... $FILE.getCanonicalPath().startsWith(...) ...>) {
            ...
          }
      - pattern-not-inside: |
          $FILE = new File(...);
          ...
          $CANON = $FILE.getCanonicalPath();
          ...
          if (<... $CANON.startsWith(...) ...>) {
            ...
          }
    message: >-
      ContentProvider openFile() or openAssetFile() builds a filesystem path
      from the URI without checking that file's canonical path. If the
      provider is exported, any app can traverse outside the intended
      directory using ../ segments.
    languages:
      - java
    severity: ERROR
    metadata:
      cwe: cwe-22
      owasp-mobile: m1
      masvs: platform-4
      reference: >-
        https://mas.owasp.org/MASTG/tests/android/MASVS-PLATFORM/MASTG-TEST-0022/
