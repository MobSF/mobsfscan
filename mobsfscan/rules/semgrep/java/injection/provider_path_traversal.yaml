rules:
  - id: android_provider_path_traversal
    patterns:
      - pattern-either:
          - pattern-inside: |
              $RET openFile(Uri $URI, ...) {
                ...
              }
          - pattern-inside: |
              $RET $M(..., Uri $URI, ...) {
                ...
              }
      - pattern-either:
          - pattern: new File($BASE, $URI.getLastPathSegment())
          - pattern: new File($URI.getLastPathSegment())
          - pattern: new File($BASE, $URI.getEncodedPath())
          - pattern: new File($URI.getEncodedPath())
          - pattern: new File($BASE, $URI.getPath())
      - pattern-not-inside: |
          $RET $M2(...) {
            ...
            $X.getCanonicalPath();
            ...
          }
      - pattern-not-inside: |
          $RET $M2(...) {
            ...
            if (<... $X.getCanonicalPath() ...>) {
              ...
            }
            ...
          }
    message: >-
      ContentProvider openFile() builds a file path from attacker-controlled
      URI parts without canonicalization. If the provider is exported, any
      app can traverse outside the intended directory using ../ segments.
    languages:
      - java
    severity: ERROR
    metadata:
      cwe: cwe-22
      owasp-mobile: m1
      masvs: platform-4
      reference: >-
        https://mas.owasp.org/MASTG/tests/android/MASVS-PLATFORM/MASTG-TEST-0022/
