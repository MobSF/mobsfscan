rules:
  - id: android_deeplink_to_webview
    mode: taint
    pattern-sources:
      - pattern: getIntent().getData()
      - pattern: $O.getIntent().getData()
      - pattern: getIntent().getDataString()
      - pattern: $O.getIntent().getDataString()
    pattern-sinks:
      - patterns:
          - pattern: $W.loadUrl($URL, ...)
          - pattern-not-inside: |
              if (<... $X.getHost() ...>) { ... }
          - focus-metavariable: $URL
    message: >-
      Deep link or external Intent data is loaded into a WebView. If the
      activity is browsable, any web page can drive this load; combined with
      a JavaScript bridge it becomes remote content injection into the app
      context.
    languages:
      - java
    severity: WARNING
    metadata:
      cwe: cwe-919
      owasp-mobile: m1
      masvs: platform-5
      reference: >-
        https://mas.owasp.org/MASTG/Android/0x05h-Testing-Platform-Interaction/
