  - id: hardcoded_secret
    patterns:
      - pattern-not: $X = "";
      - pattern-not: $M($X, "", ...);
      - pattern-either:
          - pattern: |
              $X = "...";
          - pattern: |
              $M($X, "...", ...);
      - metavariable-regex:
          metavariable: "$X"
          regex: "(?i:^.{0,100}secret.{0,100})"
    message: >-
      A hardcoded secret is identified.
    languages:
      - java
    severity: WARNING
    metadata:
      cwe: cwe-798
      owasp-mobile: m9
      masvs: storage-14
      reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#storing-a-key---example
  - id: google_api_key
    patterns:
      - pattern-regex: '(?<![A-Za-z0-9_])AIza[0-9A-Za-z_\-]{35}(?![A-Za-z0-9_])'
    message: >-
      A Google API key is identified. API keys are not secrets by
      themselves, but an unrestricted key can be abused for quota theft or
      billed services. Apply package name / API restrictions.
    languages:
      - java
    severity: WARNING
    metadata:
      cwe: cwe-798
      owasp-mobile: m2
      masvs: code-3
      reference: >-
        https://cloud.google.com/docs/authentication/api-keys
  - id: private_key_pem
    patterns:
      - pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
    message: >-
      Hardcoded private key material (PEM) is identified. Private keys must
      never be embedded in source code or shipped inside the application.
    languages:
      - java
    severity: ERROR
    metadata:
      cwe: cwe-798
      owasp-mobile: m2
      masvs: code-3
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md
